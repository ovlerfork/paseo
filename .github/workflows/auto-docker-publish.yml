name: Fork Release Build

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_run:
    workflows: ["Patch Check"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream ref to build from"
        required: false
        default: ""
      paseo_version:
        description: "Paseo version to build. Must match the patched source package.json version."
        required: false
        default: ""
      publish_mode:
        description: "Image tag policy to publish"
        required: false
        default: release
        type: choice
        options:
          - release
          - prerelease
          - dev
      patchset_ref:
        description: "Exact patchset commit to use for development publishing"
        required: false
        default: ""
      clients_only:
        description: "Build client releases without publishing Docker images"
        required: false
        default: false
        type: boolean
      publish:
        description: "Publish images and a GitHub Release after building"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-publish-${{ github.event_name == 'workflow_dispatch' && inputs.upstream_ref || github.event_name == 'schedule' && github.event.schedule || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  prepare:
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'patchset')
    runs-on: ubuntu-latest
    concurrency:
      group: patched-prepare-${{ github.event_name == 'workflow_dispatch' && inputs.upstream_ref || github.event_name == 'schedule' && github.event.schedule || github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.meta.outputs.version }}
      owner: ${{ steps.meta.outputs.owner }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      upstream_sha: ${{ steps.meta.outputs.upstream_sha }}
      patched_sha: ${{ steps.meta.outputs.patched_sha }}
      patchset_sha: ${{ steps.patchset.outputs.sha }}
      publish_mode: ${{ steps.meta.outputs.publish_mode }}
      clients_only: ${{ steps.upstream_ref.outputs.clients_only }}
      publish_clients: ${{ steps.upstream_ref.outputs.publish_clients }}
      publish_source_images: ${{ steps.source_image_status.outputs.publish_source_images || 'true' }}
      publish: ${{ steps.publish.outputs.value }}
      release_needed: ${{ steps.release_status.outputs.needed }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_channel: ${{ steps.meta.outputs.release_channel }}
    steps:
      - name: Checkout patchset
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_mode == 'dev' && inputs.patchset_ref || 'patchset' }}
          path: patchset

      - name: Record exact patchset SHA
        id: patchset
        working-directory: patchset
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve publishing intent
        id: publish
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${INPUT_PUBLISH}" != "true" ]]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve upstream source ref
        id: upstream_ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_CLIENTS_ONLY: ${{ inputs.clients_only }}
          INPUT_PUBLISH_MODE: ${{ inputs.publish_mode }}
          INPUT_UPSTREAM_REF: ${{ inputs.upstream_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          clients_only=false
          publish_clients=true
          if [[ "${EVENT_NAME}" == "schedule" && "${SCHEDULE}" == "17 * * * *" ]]; then
            clients_only=true
            publish_mode=release
          elif [[ "${EVENT_NAME}" == "schedule" && "${SCHEDULE}" == "47 * * * *" ]]; then
            clients_only=true
            publish_mode=prerelease
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            publish_mode="${INPUT_PUBLISH_MODE}"
            clients_only="${INPUT_CLIENTS_ONLY:-false}"
          elif [[ "${EVENT_NAME}" == "schedule" ]]; then
            publish_mode=prerelease
            publish_clients=false
          else
            publish_mode=dev
          fi

          if [[ -n "${INPUT_UPSTREAM_REF}" ]]; then
            upstream_ref="${INPUT_UPSTREAM_REF}"
          elif [[ "${publish_mode}" == "dev" ]]; then
            upstream_ref=main
          elif [[ "${clients_only}" == "true" && "${publish_mode}" == "prerelease" ]]; then
            upstream_ref="$(gh api --paginate 'repos/getpaseo/paseo/releases?per_page=100' | jq --slurp -r '[.[][] | select(.prerelease and (.draft | not) and (.tag_name | test("-beta[.-]"; "i")))] | max_by(.published_at).tag_name')"
          elif [[ "${publish_mode}" == "prerelease" ]]; then
            upstream_ref="$(gh api --paginate 'repos/getpaseo/paseo/releases?per_page=100' | jq --slurp -r '[.[][] | select(.draft | not)] | max_by(.published_at).tag_name')"
          else
            upstream_ref="$(gh api --paginate 'repos/getpaseo/paseo/releases?per_page=100' | jq --slurp -r '[.[][] | select((.prerelease | not) and (.draft | not))] | max_by(.published_at).tag_name')"
          fi
          if [[ -z "${upstream_ref}" || "${upstream_ref}" == "null" ]]; then
            echo "No published upstream ${publish_mode} release was found." >&2
            exit 1
          fi
          echo "ref=${upstream_ref}" >> "$GITHUB_OUTPUT"
          echo "publish_mode=${publish_mode}" >> "$GITHUB_OUTPUT"
          echo "clients_only=${clients_only}" >> "$GITHUB_OUTPUT"
          echo "publish_clients=${publish_clients}" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream ref: ${upstream_ref} (${publish_mode})"

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: getpaseo/paseo
          ref: ${{ steps.upstream_ref.outputs.ref }}
          path: source
          fetch-depth: 0

      - name: Record exact upstream SHA
        id: upstream
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Apply patches
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name "patch-ci"
          git config user.email "ci@localhost"
          git config rerere.enabled true

          shopt -s nullglob
          PATCHES=(../patchset/patches/cur/*.patch)
          APPLIED=0
          for patch in "${PATCHES[@]}"; do
            NAME=$(basename "$patch")
            echo "==== Applying: $NAME ===="
            git am --3way --committer-date-is-author-date "$patch"
            APPLIED=$((APPLIED + 1))
          done
          echo "Applied ${APPLIED} patch(es)."

      - name: Record pre-sanitization source SHA
        id: source_identity
        working-directory: source
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sanitize generated branch
        working-directory: source
        run: |
          set -euo pipefail
          if [[ -d .github/workflows ]]; then
            rm -rf .github/workflows
            git add -A .github/workflows
            if ! git diff --cached --quiet; then
              commit_date="$(git show -s --format=%aI HEAD)"
              GIT_AUTHOR_DATE="${commit_date}" GIT_COMMITTER_DATE="${commit_date}" \
                git commit -m "Drop upstream workflow files from generated patched branch"
            fi
          fi

      - name: Archive patched source for a dry run
        if: steps.publish.outputs.value == 'false'
        working-directory: source
        run: tar --exclude=.git -czf "${RUNNER_TEMP}/patched-source.tar.gz" .

      - name: Upload patched source for a dry run
        if: steps.publish.outputs.value == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: patched-source
          path: ${{ runner.temp }}/patched-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Update patched branch
        if: steps.publish.outputs.value == 'true' && steps.upstream_ref.outputs.clients_only != 'true'
        working-directory: source
        run: |
          set -euo pipefail
          git remote add our-fork "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" || true
          git push our-fork HEAD:refs/heads/patched --force

      - name: Resolve metadata
        id: meta
        working-directory: source
        env:
          INPUT_PASEO_VERSION: ${{ inputs.paseo_version }}
          PUBLISH_MODE: ${{ steps.upstream_ref.outputs.publish_mode }}
          REPO_OWNER: ${{ github.repository_owner }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          SOURCE_SHA: ${{ steps.source_identity.outputs.sha }}
        run: |
          set -euo pipefail
          source_version="$(node -p "require('./package.json').version")"
          if [[ -n "${INPUT_PASEO_VERSION}" && "${INPUT_PASEO_VERSION}" != "${source_version}" ]]; then
            printf 'paseo_version input (%s) must match source/package.json version (%s)\n' "${INPUT_PASEO_VERSION}" "${source_version}" >&2
            exit 1
          fi
          version="${source_version}"
          owner="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          patched_sha="$(git rev-parse HEAD)"
          source_sha="${SOURCE_SHA}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "patched_sha=${patched_sha}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          release_tag="v${version}-source-${source_sha}"
          if [[ "${PUBLISH_MODE}" == "dev" ]]; then
            release_tag="v${version%%-*}-dev.source-${source_sha}"
          elif [[ "${PUBLISH_MODE}" != "release" ]]; then
            release_tag="${release_tag}-${PUBLISH_MODE}"
          fi
          if [[ "${PUBLISH_MODE}" == "dev" ]]; then
            release_channel=dev
          elif [[ "${version}" == *-* ]]; then
            release_channel=beta
          else
            release_channel=latest
          fi
          echo "publish_mode=${PUBLISH_MODE}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_channel=${release_channel}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${version} owner=${owner} source_sha=${source_sha} upstream_sha=${UPSTREAM_SHA} patched_sha=${patched_sha} publish_mode=${PUBLISH_MODE} release_tag=${release_tag} release_channel=${release_channel}"

      - name: Create immutable release source tag
        if: steps.publish.outputs.value == 'true' && steps.upstream_ref.outputs.publish_clients == 'true'
        working-directory: source
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          git remote add our-fork "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" || true
          if git ls-remote --exit-code --tags our-fork "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Using existing immutable release source tag ${RELEASE_TAG}."
          else
            git tag -a "${RELEASE_TAG}" -m "Paseo patched source ${RELEASE_TAG}"
            git push our-fork "refs/tags/${RELEASE_TAG}"
          fi

      - name: Check fork release status
        id: release_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.meta.outputs.release_channel }}
        run: |
          set -euo pipefail
          needed=true
          if assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            if grep -Fxq "Paseo-Setup-${VERSION}-x64.exe" <<<"${assets}" \
              && grep -Fxq "Paseo-Setup-${VERSION}-x64.zip" <<<"${assets}" \
              && grep -Fxq "Paseo-Setup-${VERSION}-arm64.exe" <<<"${assets}" \
              && grep -Fxq "Paseo-Setup-${VERSION}-arm64.zip" <<<"${assets}" \
              && grep -Fxq "${RELEASE_CHANNEL}.yml" <<<"${assets}" \
              && grep -Fxq "Paseo-${VERSION}-arm64.dmg" <<<"${assets}" \
              && grep -Fxq "Paseo-${VERSION}-arm64.zip" <<<"${assets}" \
              && grep -Fxq "${RELEASE_CHANNEL}-mac.yml" <<<"${assets}" \
              && grep -Fxq "Paseo-x86_64.AppImage" <<<"${assets}" \
              && grep -Fxq "Paseo-${VERSION}-amd64.deb" <<<"${assets}" \
              && grep -Fxq "Paseo-${VERSION}-x86_64.rpm" <<<"${assets}" \
              && grep -Fxq "Paseo-${VERSION}-x64.tar.gz" <<<"${assets}" \
              && grep -Fxq "${RELEASE_CHANNEL}-linux.yml" <<<"${assets}" \
              && grep -Fxq "Paseo-${VERSION}-ios-unsigned.ipa" <<<"${assets}"; then
              needed=false
            fi
          fi
          echo "needed=${needed}" >> "$GITHUB_OUTPUT"
          echo "Fork release ${RELEASE_TAG} needs client assets: ${needed}"

      - name: Check source image status
        id: source_image_status
        if: steps.upstream_ref.outputs.clients_only != 'true' && (steps.meta.outputs.publish_mode == 'dev' || steps.meta.outputs.publish_mode == 'prerelease')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          RESOLVED_VERSION: ${{ steps.meta.outputs.version }}
          PUBLISH_MODE: ${{ steps.meta.outputs.publish_mode }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          UPSTREAM_SHA: ${{ steps.meta.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          source "${GITHUB_WORKSPACE}/patchset/.github/workflows/docker-publish-policy.sh"
          owner_type="$(gh api "users/${REPO_OWNER}" --jq '.type')"
          if [[ "${owner_type}" == "Organization" ]]; then
            package_path="orgs/${REPO_OWNER}/packages/container/paseo/versions?per_page=100"
          else
            package_path="users/${REPO_OWNER}/packages/container/paseo/versions?per_page=100"
          fi

          existing_tags="$(docker_publish_existing_tags "${package_path}")"

          mapfile -t immutable_tags < <(docker_publish_immutable_tags "${PUBLISH_MODE}" "${RESOLVED_VERSION}" "${SOURCE_SHA}" "${UPSTREAM_SHA}")
          default_immutable_tag="${immutable_tags[0]}"
          ubuntu_immutable_tag="${immutable_tags[1]}"
          default_tag_exists=false
          ubuntu_tag_exists=false
          if grep -Fxq "${default_immutable_tag}" <<<"${existing_tags}"; then
            default_tag_exists=true
          fi
          if grep -Fxq "${ubuntu_immutable_tag}" <<<"${existing_tags}"; then
            ubuntu_tag_exists=true
          fi

          publish_source_images="$(docker_publish_source_images_needed "${default_tag_exists}" "${ubuntu_tag_exists}")"

          echo "publish_source_images=${publish_source_images}" >> "$GITHUB_OUTPUT"
          echo "default_tag_exists=${default_tag_exists}" >> "$GITHUB_OUTPUT"
          echo "ubuntu_tag_exists=${ubuntu_tag_exists}" >> "$GITHUB_OUTPUT"
          echo "Source image publish needed for ${PUBLISH_MODE}: ${publish_source_images}"

  publish-source-image:
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.clients_only != 'true' && needs.prepare.outputs.publish_source_images == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    name: Publish ${{ matrix.image.name }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: default
            cache_scope: paseo-source
            release_moving_tag: latest
            runtime_image: node:24.16.0-bookworm-slim
            runtime_user: paseo
            variant: ""
          - name: ubuntu-sandbox
            cache_scope: paseo-source-ubuntu-sandbox
            release_moving_tag: ubuntu-sandbox
            runtime_image: ubuntu:24.04
            runtime_user: root
            variant: ubuntu-sandbox
    steps:
      - name: Checkout sanitized patched source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.patched_sha }}
          path: source
          fetch-depth: 0

      - name: Checkout publish policy
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.patchset_sha }}
          path: policy
          fetch-depth: 0

      - name: Compute tags
        id: tags
        env:
          IMAGE_BASE: ghcr.io/${{ needs.prepare.outputs.owner }}/paseo
          PUBLISH_MODE: ${{ needs.prepare.outputs.publish_mode }}
          RELEASE_MOVING_TAG: ${{ matrix.image.release_moving_tag }}
          RESOLVED_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
          VARIANT: ${{ matrix.image.variant }}
        run: |
          set -euo pipefail
          source "${GITHUB_WORKSPACE}/policy/.github/workflows/docker-publish-policy.sh"
          tags="$(docker_publish_source_tags "${IMAGE_BASE}" "${PUBLISH_MODE}" "${RELEASE_MOVING_TAG}" "${RESOLVED_VERSION}" "${SOURCE_SHA}" "${UPSTREAM_SHA}" "${VARIANT}")"
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push source image
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/docker/base/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            PASEO_VERSION=${{ needs.prepare.outputs.version }}
            PASEO_RUNTIME_USER=${{ matrix.image.runtime_user }}
            RUNTIME_IMAGE=${{ matrix.image.runtime_image }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.image.cache_scope }},mode=max

  publish-mod-images:
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.clients_only != 'true' && needs.prepare.outputs.publish_mode != 'dev'
    needs: prepare
    runs-on: ubuntu-latest
    name: Publish mod ${{ matrix.agent }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: claude-code
            npm_package: "@anthropic-ai/claude-code"
          - agent: codex
            npm_package: "@openai/codex"
          - agent: copilot
            npm_package: "@github/copilot"
          - agent: opencode
            npm_package: "opencode-ai"
          - agent: pi
            npm_package: "@earendil-works/pi-coding-agent"
          - agent: omp
            npm_package: "@oh-my-pi/pi-coding-agent"
          - agent: amp-acp
            npm_package: "amp-acp"
          - agent: codebuddy
            npm_package: "@tencent-ai/codebuddy-code"
          - agent: codewhale
            npm_package: "codewhale"
          - agent: junie
            npm_package: "@jetbrains/junie"
          - agent: kilo
            npm_package: "@kilocode/cli"
          - agent: kimi
            npm_package: "@moonshot-ai/kimi-code"
          - agent: agy-acp
            npm_package: "paseo-agy-acp"
          - agent: devspace
            npm_package: "@waishnav/devspace"
    steps:
      - name: Checkout patched source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.patched_sha }}
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve mod package version
        id: mod
        env:
          AGENT: ${{ matrix.agent }}
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_BASE: ghcr.io/${{ needs.prepare.outputs.owner }}/mods
          NPM_PACKAGE: ${{ matrix.npm_package }}
          RESOLVED_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          package_version="$(npm view "${NPM_PACKAGE}" version --silent)"
          if [[ -z "${package_version}" ]]; then
            echo "Failed to resolve ${NPM_PACKAGE} version." >&2
            exit 1
          fi

          package_version_tag="$(printf '%s' "${package_version}" | sed -E 's/[^A-Za-z0-9_.-]+/-/g')"
          package_ref="${IMAGE_BASE}:${AGENT}-pkg-${package_version_tag}"

          should_build=true
          if [[ "${EVENT_NAME}" == "schedule" ]] && docker buildx imagetools inspect "${package_ref}" >/dev/null 2>&1; then
            should_build=false
          fi

          tags="${IMAGE_BASE}:${AGENT}"
          tags="${tags}"$'\n'"${package_ref}"
          if [[ "${EVENT_NAME}" != "schedule" ]]; then
            tags="${tags}"$'\n'"${IMAGE_BASE}:${AGENT}-${RESOLVED_VERSION}"
            tags="${tags}"$'\n'"${IMAGE_BASE}:${AGENT}-${SOURCE_SHA}"
          fi

          echo "package=${NPM_PACKAGE}" >> "$GITHUB_OUTPUT"
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "package_version_tag=${package_version_tag}" >> "$GITHUB_OUTPUT"
          echo "package_ref=${package_ref}" >> "$GITHUB_OUTPUT"
          echo "should_build=${should_build}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [[ "${should_build}" == "true" ]]; then
            echo "Will publish ${AGENT} for ${NPM_PACKAGE}@${package_version}."
          else
            echo "Skipping ${AGENT}; ${package_ref} already exists."
          fi

      - name: Build and push mod image
        if: steps.mod.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: docker/mods/${{ matrix.agent }}
          file: docker/mods/${{ matrix.agent }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            PASEO_MOD_NAME=${{ matrix.agent }}
            PASEO_MOD_PACKAGE=${{ matrix.npm_package }}
            PASEO_MOD_PACKAGE_VERSION=${{ steps.mod.outputs.package_version }}
          labels: |
            org.opencontainers.image.version=${{ steps.mod.outputs.package_version }}
            org.ovlerfork.paseo.mod.name=${{ matrix.agent }}
            org.ovlerfork.paseo.mod.package=${{ matrix.npm_package }}
            org.ovlerfork.paseo.mod.package.version=${{ steps.mod.outputs.package_version }}
          tags: ${{ steps.mod.outputs.tags }}
          push: true
          provenance: false

      - name: Skip unchanged mod image
        if: steps.mod.outputs.should_build != 'true'
        run: echo "No publish needed for ${{ matrix.agent }}; package version ${{ steps.mod.outputs.package_version }} is already present."

  build-linux:
    needs: prepare
    if: needs.prepare.outputs.publish_clients == 'true' && (needs.prepare.outputs.release_needed == 'true' || needs.prepare.outputs.publish == 'false')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout patched source
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.patched_sha }}
          path: source
          fetch-depth: 0

      - name: Download patched source for a dry run
        if: needs.prepare.outputs.publish == 'false'
        uses: actions/download-artifact@v4
        with:
          name: patched-source
          path: source

      - name: Extract patched source for a dry run
        if: needs.prepare.outputs.publish == 'false'
        run: tar -xzf patched-source.tar.gz

      - name: Initialize Git metadata for a dry run
        if: needs.prepare.outputs.publish == 'false'
        run: git init --quiet

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: source/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build Linux desktop artifacts
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.release_channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true
          PASEO_DESKTOP_SMOKE: "1"
        run: npm run build:desktop -- --publish never -c.publish.channel="${RELEASE_CHANNEL}" --linux --x64

      - name: Upload Linux desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.source_sha }}
          path: source/packages/desktop/release/*
          if-no-files-found: error
          retention-days: 14

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.publish_clients == 'true' && (needs.prepare.outputs.release_needed == 'true' || needs.prepare.outputs.publish == 'false')
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout patched source
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.patched_sha }}
          path: source
          fetch-depth: 0

      - name: Download patched source for a dry run
        if: needs.prepare.outputs.publish == 'false'
        uses: actions/download-artifact@v4
        with:
          name: patched-source
          path: source

      - name: Extract patched source for a dry run
        if: needs.prepare.outputs.publish == 'false'
        run: tar -xzf patched-source.tar.gz

      - name: Initialize Git metadata for a dry run
        if: needs.prepare.outputs.publish == 'false'
        run: git init --quiet

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: source/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build Windows desktop artifacts
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.release_channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true
          PASEO_DESKTOP_SMOKE: "1"
        run: npm run build:desktop -- --publish never -c.publish.channel="${RELEASE_CHANNEL}" --win --x64 --arm64

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.source_sha }}
          path: source/packages/desktop/release/*
          if-no-files-found: error
          retention-days: 14

  build-macos:
    needs: prepare
    if: needs.prepare.outputs.publish_clients == 'true' && (needs.prepare.outputs.release_needed == 'true' || needs.prepare.outputs.publish == 'false')
    runs-on: macos-14
    permissions:
      contents: read
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout patched source
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.patched_sha }}
          path: source
          fetch-depth: 0

      - name: Download patched source for a dry run
        if: needs.prepare.outputs.publish == 'false'
        uses: actions/download-artifact@v4
        with:
          name: patched-source
          path: source

      - name: Extract patched source for a dry run
        if: needs.prepare.outputs.publish == 'false'
        run: tar -xzf patched-source.tar.gz

      - name: Initialize Git metadata for a dry run
        if: needs.prepare.outputs.publish == 'false'
        run: git init --quiet

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: source/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build ad-hoc-signed macOS desktop artifacts
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.release_channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NODE_OPTIONS: --max-old-space-size=4096
        run: >
          npm run build:desktop -- --publish never -c.publish.channel="${RELEASE_CHANNEL}" --mac --arm64
          -c.mac.identity=-
          -c.mac.notarize=false
          -c.mac.hardenedRuntime=false

      - name: Verify macOS archive app signatures
        shell: bash
        run: |
          set -euo pipefail

          verify_app_signature() {
            local app_path="$1"
            local code_path
            local flags_value
            local signature_details
            local signature
            local team_identifier

            codesign --verify --deep --strict --verbose=2 "${app_path}"
            while IFS= read -r -d '' code_path; do
              if [[ "${code_path}" != "${app_path}" ]] && ! file -b "${code_path}" | grep -Fq 'Mach-O'; then
                continue
              fi

              signature_details="$(codesign --display --verbose=4 "${code_path}" 2>&1)"
              signature="$(grep '^Signature=' <<<"${signature_details}")"
              flags_value="$(sed -nE 's/^CodeDirectory .* flags=(0x[[:xdigit:]]+).*/\1/p' <<<"${signature_details}")"
              team_identifier="$(grep '^TeamIdentifier=' <<<"${signature_details}" || true)"
              printf 'Signature %s: %s flags=%s %s\n' "${code_path#${app_path}/}" "${signature}" "${flags_value}" "${team_identifier}"

              [[ "${signature}" == 'Signature=adhoc' ]]
              [[ -z "${team_identifier}" || "${team_identifier}" == 'TeamIdentifier=not set' ]]
              [[ "${flags_value}" =~ ^0x[[:xdigit:]]+$ ]]
              # CS_RUNTIME marks code signed with the hardened runtime.
              (( (flags_value & 0x10000) == 0 ))
            done < <(printf '%s\0' "${app_path}"; find "${app_path}/Contents" -type f -print0)
          }

          stop_app() {
            local pid="${app_pid:-}"

            [[ -n "${pid}" ]] || return 0
            if kill -0 "${pid}" 2>/dev/null; then
              kill -TERM "${pid}" 2>/dev/null || true
              for _ in {1..10}; do
                kill -0 "${pid}" 2>/dev/null || break
                sleep 0.2
              done
              kill -0 "${pid}" 2>/dev/null && kill -KILL "${pid}" 2>/dev/null || true
            fi
            wait "${pid}" 2>/dev/null || true
            app_pid=''
          }

          cleanup() {
            local status="$?"

            stop_app
            if [[ "${dmg_mounted}" == true ]]; then
              if hdiutil detach -quiet "${dmg_mount}"; then
                dmg_mounted=false
              fi
            fi
            if [[ "${dmg_mounted}" == false ]]; then
              rm -rf "${verification_dir}"
            fi
            exit "${status}"
          }

          smoke_test_app_startup() {
            local app_path="$1"
            local executable_name
            local executable_path
            local startup_log
            local startup_status
            local user_data_dir

            executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app_path}/Contents/Info.plist")"
            executable_path="${app_path}/Contents/MacOS/${executable_name}"
            startup_log="${verification_dir}/startup.log"
            user_data_dir="$(mktemp -d "${verification_dir}/user-data.XXXXXX")"
            [[ -x "${executable_path}" ]]

            PASEO_ELECTRON_USER_DATA_DIR="${user_data_dir}" "${executable_path}" >"${startup_log}" 2>&1 &
            app_pid="$!"
            sleep 5
            if ! kill -0 "${app_pid}" 2>/dev/null; then
              if wait "${app_pid}"; then
                startup_status=0
              else
                startup_status="$?"
              fi
              app_pid=''
              printf 'App exited during startup (status %s): %s\n' "${startup_status}" "${executable_path}" >&2
              if [[ -s "${startup_log}" ]]; then
                cat "${startup_log}" >&2
              else
                printf 'Captured stdout/stderr: (empty)\n' >&2
              fi
              exit 1
            fi
            stop_app
          }

          release_dir=packages/desktop/release
          zip_file="$(find "${release_dir}" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          dmg_file="$(find "${release_dir}" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          [[ -n "${zip_file}" && -n "${dmg_file}" ]]

          verification_dir="$(mktemp -d)"
          app_pid=''
          dmg_mount="${verification_dir}/dmg-mount"
          dmg_mounted=false
          trap cleanup EXIT

          ditto -x -k "${zip_file}" "${verification_dir}/zip"
          zip_app="$(find "${verification_dir}/zip" -type d -name '*.app' -print -quit)"
          [[ -n "${zip_app}" ]]
          verify_app_signature "${zip_app}"
          smoke_test_app_startup "${zip_app}"

          mkdir -p "${dmg_mount}"
          hdiutil attach -nobrowse -readonly -mountpoint "${dmg_mount}" "${dmg_file}" >/dev/null
          dmg_mounted=true
          dmg_app="$(find "${dmg_mount}" -type d -name '*.app' -print -quit)"
          [[ -n "${dmg_app}" ]]
          dmg_install_dir="${verification_dir}/dmg-installed"
          dmg_installed_app="${dmg_install_dir}/$(basename "${dmg_app}")"
          mkdir -p "${dmg_install_dir}"
          ditto "${dmg_app}" "${dmg_installed_app}"
          hdiutil detach -quiet "${dmg_mount}"
          dmg_mounted=false
          verify_app_signature "${dmg_installed_app}"
          smoke_test_app_startup "${dmg_installed_app}"

      - name: Upload macOS desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.source_sha }}
          path: source/packages/desktop/release/*
          if-no-files-found: error
          retention-days: 14

  build-ios:
    needs: prepare
    if: needs.prepare.outputs.publish_clients == 'true' && (needs.prepare.outputs.release_needed == 'true' || needs.prepare.outputs.publish == 'false')
    runs-on: macos-14
    permissions:
      contents: read
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout patched source
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.patched_sha }}
          path: source
          fetch-depth: 0

      - name: Download patched source for a dry run
        if: needs.prepare.outputs.publish == 'false'
        uses: actions/download-artifact@v4
        with:
          name: patched-source
          path: source

      - name: Extract patched source for a dry run
        if: needs.prepare.outputs.publish == 'false'
        run: tar -xzf patched-source.tar.gz

      - name: Initialize Git metadata for a dry run
        if: needs.prepare.outputs.publish == 'false'
        run: git init --quiet

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: source/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Select supported Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build unsigned iOS IPA
        shell: bash
        run: |
          set -euo pipefail
          npm run build:app-deps
          (
            cd packages/app
            APP_VARIANT=production npx expo prebuild --platform ios --clean --non-interactive
            xcodebuild \
              -workspace ios/Paseo.xcworkspace \
              -scheme Paseo \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath ios/build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          )
          app_path="packages/app/ios/build/Build/Products/Release-iphoneos/Paseo.app"
          test -d "${app_path}"
          mkdir -p Payload
          cp -R "${app_path}" Payload/Paseo.app
          ditto -c -k --sequesterRsrc --keepParent Payload "Paseo-${{ needs.prepare.outputs.version }}-ios-unsigned.ipa"

      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: release-ios-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.source_sha }}
          path: source/Paseo-${{ needs.prepare.outputs.version }}-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: [prepare, publish-source-image, build-linux, build-windows, build-macos, build-ios]
    if: >
      always() &&
      needs.prepare.outputs.publish == 'true' &&
      needs.prepare.outputs.publish_clients == 'true' &&
      needs.prepare.outputs.release_needed == 'true' &&
      (needs.publish-source-image.result == 'success' || needs.publish-source-image.result == 'skipped') &&
      needs.build-linux.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-ios.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Download client artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts

      - name: Checkout release asset preparation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.patchset_sha }}
          path: release-policy
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release asset dependency
        run: python3 -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Prepare release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.release_channel }}
        run: >
          python3 release-policy/scripts/prepare-release-assets.py
          --artifacts artifacts
          --output release-assets
          --version "${VERSION}"
          --channel "${RELEASE_CHANNEL}"

      - name: Publish fork GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.release_channel }}
          PUBLISH_MODE: ${{ needs.prepare.outputs.publish_mode }}
          IMAGE_OWNER: ${{ needs.prepare.outputs.owner }}
          CLIENTS_ONLY: ${{ needs.prepare.outputs.clients_only }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.release_tag }}"
          prerelease_flag=()
          image_tag="${VERSION}-${SOURCE_SHA}"
          if [[ "${PUBLISH_MODE}" == "dev" ]]; then
            image_tag="dev-${UPSTREAM_SHA}-source-${SOURCE_SHA}"
          fi
          if [[ "${PUBLISH_MODE}" != "release" ]]; then
            prerelease_flag=(--prerelease)
          fi
          notes="$(printf 'Built from upstream %s with patch source %s.\n\nGHCR: ghcr.io/%s/paseo:%s' "${UPSTREAM_SHA}" "${SOURCE_SHA}" "${IMAGE_OWNER}" "${image_tag}")"
          if [[ "${CLIENTS_ONLY}" == "true" ]]; then
            notes="$(printf 'Built from upstream %s with patch source %s.' "${UPSTREAM_SHA}" "${SOURCE_SHA}")"
          fi
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${tag}" release-assets/* --repo "${GITHUB_REPOSITORY}" --title "Paseo ${VERSION}" --notes "${notes}" "${prerelease_flag[@]}"
          fi
