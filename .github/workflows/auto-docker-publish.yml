name: Diagnose published macOS app launch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-macos-launch:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Inspect published Apple Silicon app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo=ovlerfork/paseo
          tag=v0.14.0-dev.source-4e79c38d0
          asset=Paseo-0.14.0-beta.1-arm64.dmg
          asset_id=683265900
          digest=48b03f4e79ce37070db28e349a8c5af2dc3a4414fe5a9fe5b6af1c324d241939
          work_dir="$(mktemp -d "${RUNNER_TEMP}/paseo-mac-diagnostic.XXXXXX")"
          mount_dir="${work_dir}/mounted"
          installed_app="${work_dir}/installed/Paseo.app"
          mounted=false

          cleanup() {
            if [[ "${mounted}" == true ]]; then
              hdiutil detach -quiet "${mount_dir}" || true
            fi
          }
          trap cleanup EXIT

          sw_vers
          uname -m
          [[ "$(uname -m)" == arm64 ]]

          gh api "repos/${repo}/releases/assets/${asset_id}" > "${work_dir}/asset.json"
          jq -e --arg name "${asset}" --argjson id "${asset_id}" \
            --arg digest "sha256:${digest}" \
            '.id == $id and .name == $name and .size == 186566159 and .digest == $digest' \
            "${work_dir}/asset.json" >/dev/null
          gh release download "${tag}" --repo "${repo}" --pattern "${asset}" --dir "${work_dir}"
          printf '%s  %s\n' "${digest}" "${work_dir}/${asset}" | shasum -a 256 -c -

          mkdir -p "${mount_dir}" "$(dirname "${installed_app}")"
          hdiutil attach -readonly -nobrowse -mountpoint "${mount_dir}" "${work_dir}/${asset}" >/dev/null
          mounted=true
          ditto "${mount_dir}/Paseo.app" "${installed_app}"
          hdiutil detach -quiet "${mount_dir}"
          mounted=false

          file "${installed_app}/Contents/MacOS/Paseo"
          codesign --verify --deep --strict --verbose=2 "${installed_app}"
          for signed_path in \
            "${installed_app}" \
            "${installed_app}/Contents/Frameworks/Electron Framework.framework" \
            "${installed_app}/Contents/Frameworks/Paseo Helper (Renderer).app"; do
            printf '\nSignature and entitlements: %s\n' "${signed_path}"
            codesign --display --verbose=4 "${signed_path}" 2>&1 | \
              grep -E '^(Identifier=|CodeDirectory |Signature=|TeamIdentifier=|Authority=)' || true
            codesign --display --entitlements :- "${signed_path}" 2>&1 || true
          done

          printf '\nInitial quarantine attributes:\n'
          xattr -l "${installed_app}" || true
          printf '\nGatekeeper assessment before quarantine:\n'
          if spctl --assess --type execute --verbose=4 "${installed_app}"; then
            echo 'spctl exit: 0'
          else
            echo "spctl exit: $?"
          fi

          quarantine="0083;$(printf '%x' "$(date +%s)");Safari;"
          xattr -w com.apple.quarantine "${quarantine}" "${installed_app}"
          printf '\nQuarantine attribute applied to copied app:\n'
          xattr -p com.apple.quarantine "${installed_app}"
          printf '\nGatekeeper assessment with quarantine:\n'
          if spctl --assess --type execute --verbose=4 "${installed_app}"; then
            echo 'spctl exit: 0'
          else
            echo "spctl exit: $?"
          fi

          printf '\nLaunchServices open of quarantined app:\n'
          if open -n "${installed_app}" >"${work_dir}/open.log" 2>&1; then
            echo 'open exit: 0'
          else
            echo "open exit: $?"
          fi
          cat "${work_dir}/open.log"
          sleep 8
          if screencapture -x "${RUNNER_TEMP}/paseo-mac-launch-screen.png"; then
            echo 'Captured runner display after LaunchServices open.'
          else
            echo 'Runner display capture unavailable; LaunchServices and policy logs remain diagnostic.'
          fi
          printf '\nPaseo processes after open:\n'
          pgrep -fl 'Paseo.app/Contents/MacOS/Paseo' || true
          printf '\nRecent macOS policy logs:\n'
          log show --last 3m --style compact \
            --predicate 'process == "syspolicyd" OR process == "amfid" OR process == "taskgated-helper"' \
            2>&1 | tail -100 || true
          printf '\nRecent Paseo crash reports, if any:\n'
          find "${HOME}/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name '*Paseo*' -mmin -5 \
            -print -exec tail -60 {} \; 2>/dev/null | tail -120 || true

      - name: Upload runner display if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paseo-mac-launch-screen
          path: ${{ runner.temp }}/paseo-mac-launch-screen.png
          if-no-files-found: ignore
