name: Fork Release Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-dev-release-asset-cleanup
  cancel-in-progress: false

jobs:
  cleanup-legacy-release:
    if: github.repository == 'ovlerfork/paseo' && github.ref_name == 'chore/cleanup-dev-release-assets'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup policy
        uses: actions/checkout@v4

      - name: Validate release and back up accidental assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cleanup-dev-release-assets.py prepare --backup-dir "$RUNNER_TEMP/release-asset-backup"

      - name: Retain release asset backup
        uses: actions/upload-artifact@v4
        with:
          name: legacy-dev-release-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/release-asset-backup/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Remove verified accidental assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cleanup-dev-release-assets.py delete
